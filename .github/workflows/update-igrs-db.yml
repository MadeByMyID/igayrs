name: Update IGRS Database

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-igrs-db
  cancel-in-progress: false

jobs:
  update-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest IGRS public database
        run: |
          set -euo pipefail

          RAW_DIR=".tmp-igrs-raw"

          CHUNK_SIZE=2000
          CONCURRENCY=30
          CURRENT_START=0

          rm -rf "$RAW_DIR"
          mkdir -p "$RAW_DIR"

          echo "Starting parallel fetch in chunks of ${CHUNK_SIZE} (concurrency: ${CONCURRENCY})"

          while true; do
            CURRENT_END=$((CURRENT_START + CHUNK_SIZE - 1))
            echo ">>> Fetching batch: IDs ${CURRENT_START} to ${CURRENT_END}"

            FILES_BEFORE="$(find "$RAW_DIR" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"

            seq "$CURRENT_START" "$CURRENT_END" | xargs -P "$CONCURRENCY" -I {} bash -c '
              set -euo pipefail
              ID="$1"
              RAW_DIR="$2"

              case "$ID" in
                (""|*[!0-9]*)
                  printf 'Skipping invalid game ID: %s\n' "$ID" >&2
                  exit 0
                  ;;
              esac

              API_URL="https://api.igrs.id/public/games/${ID}"
              TEMP_FILE="${RAW_DIR}/${ID}.json"

              set +e
              HTTP_STATUS="$(curl \
                --silent \
                --show-error \
                --globoff \
                --retry 3 \
                --retry-delay 1 \
                --max-time 20 \
                --output "$TEMP_FILE" \
                --write-out "%{http_code}" \
                "$API_URL")"

              CURL_EXIT=$?
              set -e

              if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_STATUS" -eq 200 ] && jq -e '.id != null' "$TEMP_FILE" > /dev/null 2>&1; then
                jq -c '.' "$TEMP_FILE" > "${TEMP_FILE}.min"
                mv "${TEMP_FILE}.min" "$TEMP_FILE"
              else
                printf 'Failed to fetch IGRS game: id=%s url=%s curl_exit=%s http_status=%s\n' "$ID" "$API_URL" "$CURL_EXIT" "$HTTP_STATUS" >&2
                rm -f "$TEMP_FILE"
              fi
            ' _ {} "$RAW_DIR"

            FILES_AFTER="$(find "$RAW_DIR" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
            GAMES_ADDED=$((FILES_AFTER - FILES_BEFORE))

            echo ">>> Batch complete. Games found in this chunk: ${GAMES_ADDED}"

            if [ "$GAMES_ADDED" -eq 0 ]; then
              echo "No games found in batch ${CURRENT_START}-${CURRENT_END}. Assuming end."
              break
            fi

            CURRENT_START=$((CURRENT_START + CHUNK_SIZE))
          done

          if ! find "$RAW_DIR" -maxdepth 1 -type f -name '*.json' | grep -q .; then
            echo "ERROR: No games fetched." >&2
            exit 1
          fi

          find "$RAW_DIR" -maxdepth 1 -name '*.json' -print0 | xargs -0 cat | jq -s 'sort_by(.id)' > "igrs.pubdb.json"

          GAME_COUNT="$(jq 'unique_by(.id) | length' "igrs.pubdb.json")"
          echo "Merged ${GAME_COUNT} games into igrs.pubdb.json"

      - name: Validate assembled JSON
        run: |
          jq -e 'type == "array"' "igrs.pubdb.json" >/dev/null

      - name: Download ratings and descriptors
        run: |
          set -euo pipefail

          echo "Fetching ratings from https://api.igrs.id/public/ratings"
          curl --fail --show-error --silent --location "https://api.igrs.id/public/ratings" -o "ratings-api.json"
          jq empty "ratings-api.json"

          echo "Fetching descriptors from https://api.igrs.id/public/descriptors"
          curl --fail --show-error --silent --location "https://api.igrs.id/public/descriptors" -o "descriptors-api.json"
          jq empty "descriptors-api.json"

          echo "Downloaded ratings and descriptors successfully"

      - name: Normalize and split database
        run: |
          set -euo pipefail

          OUTPUT_DIR="data/json"
          mkdir -p "$OUTPUT_DIR"

          PLATFORM_NORMALIZE='def normalize_platform:
            gsub("^\\s+|\\s+$"; "")
            | if . == "P C" then "PC"
              elif . == "Xbox Series X S" then "Xbox Series X|S"
              else .
              end;'

          RATINGS_TRANSFORM='def assign_weight:
            if .id == 7 then 1
            elif .id == 4 then 2
            elif .id == 5 then 3
            elif .id == 28 then 4
            elif .id == 6 then 5
            elif .id == 35 then 6
            else 0
            end;

          (if type == "array" then . else [] end)
          | map({
            key: (.id | tostring),
            value: {
              name,
              weight: assign_weight,
              titleEn,
              titleId,
              contentEn,
              contentId
            }
          })
          | from_entries'

          DESCRIPTORS_TRANSFORM='(if type == "array" then . else [] end)
            | map({
              key: (.id | tostring),
              value: {
                nameId,
                nameEn,
                description
              }
            })
            | from_entries'

          GAMES_QUERY="${PLATFORM_NORMALIZE}
            unique_by(.id)
            | sort_by(.id)
            | reverse
          | map({
              id,
              name,
              releaseYear,
              publisherName,
              platformsName: ((.platformsName // []) | map(normalize_platform) | unique),
              description,
              videoUrl,
              inGameUrl,
              ratings: ((.ratings // []) | map(.id)),
              descriptors: ((.descriptors // []) | map(.id))
            })"

          RATINGS="$(jq "$RATINGS_TRANSFORM" "ratings-api.json")"
          DESCRIPTORS="$(jq "$DESCRIPTORS_TRANSFORM" "descriptors-api.json")"
          GAME_COUNT="$(jq 'unique_by(.id) | length' "igrs.pubdb.json")"
          GENERATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          jq -n \
            --argjson ratings "$RATINGS" \
            --argjson descriptors "$DESCRIPTORS" \
            --argjson totalGames "$GAME_COUNT" \
            --arg generatedAt "$GENERATED_AT" \
            '{
              meta: {
                generatedAt: $generatedAt,
                totalGames: $totalGames
              },
              ratings: $ratings,
              descriptors: $descriptors
            }' > "${OUTPUT_DIR}/igrs.meta.json"

          jq "$GAMES_QUERY" "igrs.pubdb.json" > "${OUTPUT_DIR}/igrs.games.json"

      - name: Remove raw dump files
        run: |
          rm -f "igrs.pubdb.json"
          rm -f "ratings-api.json"
          rm -f "descriptors-api.json"
          rm -rf ".tmp-igrs-raw"

      - name: Commit and push changes
        run: |
          git add data/json/igrs.meta.json data/json/igrs.games.json
          
          if git diff --cached --quiet; then
            echo "No data changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore(data): refresh IGRS dataset"
          git push

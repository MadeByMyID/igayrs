name: Update IGRS Database

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-igrs-db
  cancel-in-progress: false

jobs:
  update-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest IGRS public database
        run: |
          set -euo pipefail

          RAW_DIR=".tmp-igrs-raw"
          WORKER_SCRIPT=".github/scripts/fetch-igrs-game.sh"
          FAILED_IDS_FILE=".failed-fetch-ids"
          BATCH_FAILED_IDS_FILE=".batch-failed-fetch-ids"

          CHUNK_SIZE="${CHUNK_SIZE:-2000}"
          CONCURRENCY="${CONCURRENCY:-15}"
          BATCH_DELAY_SEC="${BATCH_DELAY_SEC:-20}"
          CURRENT_START=0

          echo "Setting up parallel fetching..."
          rm -rf "$RAW_DIR"
          mkdir -p "$RAW_DIR"
          > "$FAILED_IDS_FILE"
          > "$BATCH_FAILED_IDS_FILE"

          echo "Starting parallel fetch in chunks of ${CHUNK_SIZE} (concurrency: ${CONCURRENCY}, batch delay: ${BATCH_DELAY_SEC}s)"

          while true; do
            CURRENT_END=$((CURRENT_START + CHUNK_SIZE - 1))
            echo ">>> Fetching batch: IDs ${CURRENT_START} to ${CURRENT_END}"

            FILES_BEFORE="$(find "$RAW_DIR" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"

            > "$BATCH_FAILED_IDS_FILE"
            seq "$CURRENT_START" "$CURRENT_END" | xargs -P "$CONCURRENCY" -I {} bash "$WORKER_SCRIPT" {} "$RAW_DIR" 2>> "$BATCH_FAILED_IDS_FILE" || true

            FILES_AFTER="$(find "$RAW_DIR" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
            GAMES_ADDED=$((FILES_AFTER - FILES_BEFORE))
            BATCH_ERROR_COUNT="$(sed -En 's/.*id=([0-9]+).*/\1/p' "$BATCH_FAILED_IDS_FILE" | sort -u | awk '$1 >= 1000' | wc -l | tr -d ' ')"

            echo ">>> Batch complete. Games found in this chunk: ${GAMES_ADDED}"
            if [ "$GAMES_ADDED" -eq 0 ]; then
              echo "No games found in batch ${CURRENT_START}-${CURRENT_END}. Assuming end."
              echo "Dropping failed IDs from this final empty batch.."
              break
            fi

            if [ "$BATCH_ERROR_COUNT" -gt 0 ]; then
              cat "$BATCH_FAILED_IDS_FILE" >> "$FAILED_IDS_FILE"
              echo ">>> Batch had ${BATCH_ERROR_COUNT} failed IDs. Cooling down for 20s before next batch..."
              sleep 20
            fi

            if [ "$BATCH_DELAY_SEC" -gt 0 ]; then
              echo "Sleeping ${BATCH_DELAY_SEC}s before next batch..."
              sleep "$BATCH_DELAY_SEC"
            fi

            CURRENT_START=$((CURRENT_START + CHUNK_SIZE))
          done

          echo ">>> Testing previously failed IDs..."
          if [ -s "$FAILED_IDS_FILE" ]; then
            FAILED_IDS="$(sed -En 's/.*id=([0-9]+).*/\1/p' "$FAILED_IDS_FILE" | sort -u | awk '$1 >= 1000')"
            if [ -n "$FAILED_IDS" ]; then
              echo "Found $(echo "$FAILED_IDS" | wc -l) unique failed IDs. Retesting..."
              echo "$FAILED_IDS" | xargs -P "$CONCURRENCY" -I {} bash "$WORKER_SCRIPT" {} "$RAW_DIR" 2>&1 | grep -E 'Failed to fetch|Skipping' || true
              echo "Retest complete"
            else
              echo "No failed IDs found"
            fi
          else
            echo "No failed IDs to retest"
          fi

          TOTAL_FETCHED="$(find "$RAW_DIR" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
          if [ "$TOTAL_FETCHED" -eq 0 ]; then
            echo "ERROR: No games fetched." >&2
            exit 1
          fi

          echo "Merging records into JSON array..."
          find "$RAW_DIR" -maxdepth 1 -type f -name '*.json' -print0 \
            | sort -z \
            | xargs -0 cat \
            | jq -s 'sort_by(.id)' > "igrs.pubdb.json"

          jq -e 'type == "array"' "igrs.pubdb.json" >/dev/null

          GAME_COUNT="$(jq 'unique_by(.id) | length' "igrs.pubdb.json")"
          echo "Merged ${GAME_COUNT} games into igrs.pubdb.json"

          echo "Downloading ratings and descriptors..."
          RATING_DESC_ATTEMPTS=3
          RATING_DESC_RETRY_DELAY_SEC=20
          RATING_DESC_OK=0

          for attempt in $(seq 1 "$RATING_DESC_ATTEMPTS"); do
            echo "Ratings/descriptors fetch attempt ${attempt}/${RATING_DESC_ATTEMPTS}"
            if curl --fail --show-error --silent --location --max-time 3600 "https://api.igrs.id/public/ratings" -o "ratings-api.json" && \
               curl --fail --show-error --silent --location --max-time 3600 "https://api.igrs.id/public/descriptors" -o "descriptors-api.json" && \
               jq empty "ratings-api.json" && \
               jq empty "descriptors-api.json"; then
              RATING_DESC_OK=1
              echo "Downloaded ratings and descriptors successfully"
              break
            fi

            rm -f "ratings-api.json" "descriptors-api.json"
            if [ "$attempt" -lt "$RATING_DESC_ATTEMPTS" ]; then
              echo "Attempt ${attempt} failed. Waiting ${RATING_DESC_RETRY_DELAY_SEC}s before retry..."
              sleep "$RATING_DESC_RETRY_DELAY_SEC"
            fi
          done

          if [ "$RATING_DESC_OK" -ne 1 ]; then
            echo "Failed to fetch ratings/descriptors API after ${RATING_DESC_ATTEMPTS} attempts. Using existing."
            echo "Skipping metadata regeneration."
            SKIP_META=1
          fi

          echo "Normalizing and splitting database..."
          OUTPUT_DIR="data/json"
          mkdir -p "$OUTPUT_DIR"

          PLATFORM_NORMALIZE='def normalize_platform:
            gsub("^\\s+|\\s+$"; "")
            | if . == "P C" then "PC"
              elif . == "Xbox Series X S" then "Xbox Series X|S"
              else .
              end;'

          RATINGS_TRANSFORM='def assign_weight:
            if .id == 7 then 1
            elif .id == 4 then 2
            elif .id == 5 then 3
            elif .id == 28 then 4
            elif .id == 6 then 5
            elif .id == 35 then 6
            else 0
            end;

          (if type == "array" then . else [] end)
          | map({
            key: (.id | tostring),
            value: {
              name,
              weight: assign_weight,
              titleEn,
              titleId,
              contentEn,
              contentId
            }
          })
          | from_entries'

          DESCRIPTORS_TRANSFORM='(if type == "array" then . else [] end)
          | map({
              key: (.id | tostring),
              value: {
                nameId,
                nameEn,
                description
              }
            })
          | from_entries'

          GAMES_QUERY="${PLATFORM_NORMALIZE}
            unique_by(.id)
            | sort_by(.id)
            | reverse
            | map({
                id,
                name,
                releaseYear,
                publisherName,
                description,
                ratings: ((.ratings // []) | map(.id)),
                descriptors: ((.descriptors // []) | map(.id)),
                platforms: ((.platformsName // [])
                  | map(normalize_platform)
                  | map(select(length > 0))
                  | unique
                  | map(\$platformNameToId[.] // empty))
              })"

          EXTRA_QUERY="${PLATFORM_NORMALIZE}
            unique_by(.id)
            | sort_by(.id)
            | reverse
            | map({
                id,
                videoUrl,
                inGameUrl
              } | with_entries(select(.value != null)))
            | map(select(length > 1))"

          PLATFORMS_JSON="$(jq "${PLATFORM_NORMALIZE}
            [ .[] | (.platformsName // [])[] | normalize_platform ]
            | map(select(length > 0))
            | unique
            | sort
            | to_entries
            | map({key: (.key | tostring), value: .value})
            | from_entries" "igrs.pubdb.json")"

          PLATFORM_NAME_TO_ID="$(echo "$PLATFORMS_JSON" | jq '
            to_entries
            | map({ key: .value, value: (.key | tonumber) })
            | from_entries
          ')"

          if [ "${SKIP_META:-0}" -ne 1 ]; then
            RATINGS="$(jq "$RATINGS_TRANSFORM" "ratings-api.json")"
            DESCRIPTORS="$(jq "$DESCRIPTORS_TRANSFORM" "descriptors-api.json")"
            GENERATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

            jq -n \
              --argjson ratings "$RATINGS" \
              --argjson descriptors "$DESCRIPTORS" \
              --argjson platforms "$PLATFORMS_JSON" \
              --argjson totalGames "$GAME_COUNT" \
              --arg generatedAt "$GENERATED_AT" \
              '{
                meta: {
                  generatedAt: $generatedAt,
                  totalGames: $totalGames
                },
                ratings: $ratings,
                descriptors: $descriptors,
                platforms: $platforms
              }' > "${OUTPUT_DIR}/igrs.meta.json"
          fi

          jq --argjson platformNameToId "$PLATFORM_NAME_TO_ID" "$GAMES_QUERY" "igrs.pubdb.json" > "${OUTPUT_DIR}/igrs.games.json"
          jq "$EXTRA_QUERY" "igrs.pubdb.json" > "${OUTPUT_DIR}/igrs.extra.json"

          echo "Cleaning up raw dump files..."
          rm -f "igrs.pubdb.json"
          rm -f "ratings-api.json"
          rm -f "descriptors-api.json"
          rm -f "$FAILED_IDS_FILE"
          rm -rf "$RAW_DIR"

          echo "Done"

      - name: Commit and push changes
        run: |
          git add data/json/igrs.meta.json data/json/igrs.games.json data/json/igrs.extra.json
          
          if git diff --cached --quiet; then
            echo "No data changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore(data): refresh IGRS dataset"
          git push

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="../">
  <title>IGRSDB | Search</title>
  <meta name="description" content="Unofficial open database of games in the IGRS registry. But the backend isnt slow.">
  <link rel="icon" type="image/svg+xml" href="assets/data/images/favicon.svg">
  <link rel="stylesheet" href="assets/styles/main.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="header-top">
        <a href="./" class="site-logo">
          <img src="assets/data/images/favicon.svg" alt="Logo" class="logo-mark" width="36" height="36">
          <div class="logo-text">IGRS<span>DB</span></div>
        </a>
        <button class="btn header-lang-toggle" id="lang-toggle" type="button" aria-label="Switch language">
          <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#globe"></use></svg><span id="lang-label">ID</span>
        </button>
      </div>
      <div class="header-actions">
        <a href="search/" class="btn" data-i18n="nav.search">Search Games</a>
        <a href="ratings/" class="btn" data-i18n="nav.ratings">Ratings Guide</a>
        <a href="steamchecker/" class="btn" data-i18n="nav.steamchecker">Steam Game Checker</a>
      </div>
    </div>
  </header>

  <div class="app-layout">
    <div class="main-content">
      <section class="search-section">
        <div class="search-row">
          <div class="search-bar">
            <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#search"></use></svg>
            <input type="text" id="search-input" data-i18n-placeholder="search.placeholder" placeholder="Search games..." autocomplete="off" autofocus>
          </div>
          <div class="search-bar publisher-bar">
            <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#user"></use></svg>
            <input type="text" id="publisher-input" data-i18n-placeholder="search.publisher" placeholder="Filter publisher..." autocomplete="off">
          </div>
        </div>
        <div class="search-stats" id="search-stats"></div>
        <div class="active-filter-summary" id="active-filter-summary" aria-live="polite"></div>
      </section>

      <div id="list-view" class="list-view">
        <section id="game-list" class="game-list">
          <div class="loading">
            <div class="loading-spinner"></div>
            <div data-i18n="loading">Loading database...</div>
          </div>
        </section>
        <nav class="pagination" id="pagination" aria-label="Page navigation"></nav>
      </div>

      <div id="detail-page" class="detail-page"></div>
    </div>

    <aside class="sidebar" id="sidebar">
    </aside>
  </div>

  <footer class="site-footer">
    <div class="footer-line">
      <span data-i18n="footer.text">Data scraped from</span> <a href="https://igrs.id" target="_blank" rel="noopener">igrs.id</a>
      <span class="footer-separator" aria-hidden="true">-</span>
      <span class="footer-copyright">
        <svg class="ui-icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#copyright"></use></svg>
        <span class="sr-only">Copyright</span>
        <span data-current-year></span>
      </span>
      <span data-i18n="footer.disclaimer">A MadeByMyID Project</span>
    </div>
  </footer>

  <button class="scroll-top" id="scroll-top" type="button" aria-label="Scroll to top"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#arrow-up"></use></svg></button>
  <script type="module" src="src/main.js"></script>
</body>
</html>

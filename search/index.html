<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="../">
  <title>IGRSDB | Search</title>
  <meta name="description" content="Unofficial open database of games in the IGRS registry. But the backend isnt slow.">
  <link rel="icon" type="image/svg+xml" href="data/images/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="header-top">
        <a href="./" class="site-logo">
          <img src="data/images/favicon.svg" alt="Logo" class="logo-mark" width="36" height="36">
          <div class="logo-text">IGRS<span>DB</span></div>
        </a>
        <button class="btn header-lang-toggle" id="lang-toggle" type="button" aria-label="Switch language">
          🌐 <span id="lang-label">ID</span>
        </button>
      </div>
      <div class="header-actions">
        <a href="ratings/" class="btn" data-i18n="nav.ratings">Ratings Guide</a>
        <a href="steamchecker/" class="btn" data-i18n="nav.steamchecker">Steam Game Checker</a>
      </div>
    </div>
  </header>

  <div class="app-layout">
    <div class="main-content">
      <section class="search-section">
        <div class="search-row">
          <div class="search-bar">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="search-input" data-i18n-placeholder="search.placeholder" placeholder="Search games..." autocomplete="off" autofocus>
          </div>
          <div class="search-bar publisher-bar">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <input type="text" id="publisher-input" data-i18n-placeholder="search.publisher" placeholder="Filter publisher..." autocomplete="off">
          </div>
        </div>
        <div class="search-stats" id="search-stats"></div>
      </section>

      <div id="list-view" class="list-view">
        <section id="game-list" class="game-list">
          <div class="loading">
            <div class="loading-spinner"></div>
            <div data-i18n="loading">Loading database...</div>
          </div>
        </section>
        <nav class="pagination" id="pagination" aria-label="Page navigation"></nav>
      </div>

      <div id="detail-page" class="detail-page"></div>
    </div>

    <aside class="sidebar" id="sidebar">
    </aside>
  </div>

  <footer class="site-footer">
    <div>
      <span data-i18n="footer.text">Data scraped from</span> <a href="https://igrs.id" target="_blank" rel="noopener">igrs.id</a>
      · <span data-i18n="footer.disclaimer">A MadeByMyID Project</span>
    </div>
  </footer>

  <button class="scroll-top" id="scroll-top" type="button" aria-label="Scroll to top">↑</button>
  <script src="script.js"></script>
</body>
</html>

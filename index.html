<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGRSDB</title>
  <meta name="description"
    content="Unofficial open database of games in the IGRS registry. But the backend isnt slow.">
  <link rel="icon" type="image/svg+xml" href="data/images/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="./" class="site-logo">
        <img src="data/images/favicon.svg" alt="Logo" class="logo-mark" width="36" height="36">
        <div class="logo-text">IGRS<span>DB</span></div>
      </a>
      <div class="header-actions">
        <a href="search/" class="btn" data-i18n="nav.search">Search Games</a>
        <a href="ratings/" class="btn" data-i18n="nav.ratings">Ratings Guide</a>
        <button class="btn" id="lang-toggle" type="button" aria-label="Switch language">
          🌐 <span id="lang-label">ID</span>
        </button>
      </div>
    </div>
  </header>

  <main class="hero">
    <div class="hero-content">
      <img src="data/images/favicon.svg" alt="Logo" class="hero-logo">
      <h1 class="hero-title" data-i18n="home.title">Indonesian <span
          style="color: var(--primary)">Gay</span>me<br>Rating System</h1>
      <p class="hero-subtitle" data-i18n="home.subtitle">Unofficial open database of games in the IGRS registry. But
        the backend isnt slow.</p>
      <div class="hero-stats" id="hero-stats">
        <div class="hero-stat">
          <span class="hero-stat-num" id="stat-games">-</span>
          <span class="hero-stat-label" data-i18n="home.stat.games">Games</span>
        </div>
        <div class="hero-stat">
          <span class="hero-stat-num" id="stat-publishers">-</span>
          <span class="hero-stat-label" data-i18n="home.stat.publishers">Publishers</span>
        </div>
        <div class="hero-stat">
          <span class="hero-stat-num" id="stat-platforms">-</span>
          <span class="hero-stat-label" data-i18n="home.stat.platforms">Platforms</span>
        </div>
        <div class="hero-stat hero-stat-wide">
          <span class="hero-stat-num hero-stat-num-updated" id="stat-updated">-</span>
          <span class="hero-stat-label" data-i18n="home.stat.updated">Last Updated</span>
        </div>
      </div>
      <div class="hero-actions">
        <a href="search/" class="hero-btn primary" data-i18n="home.cta.search">Search Games</a>
        <a href="ratings/" class="hero-btn secondary" data-i18n="home.cta.ratings">View Ratings Guide</a>
      </div>
      <div class="hero-ratings" id="hero-ratings">
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div>
      <span data-i18n="footer.text">Data scraped from</span> <a href="https://igrs.id" target="_blank"
        rel="noopener">igrs.id</a>
      · <span data-i18n="footer.disclaimer">A MadeByMyID Project</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
